name: TwoOfUs
options:
  bundleIdPrefix: com.taylorseale
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # 1.1 opens the schedule-feature train; 1.0 (build 72) is the tagged App
    # Store submission. A lower train would sort as older than what's uploaded.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Q58H65DQ64
    CODE_SIGN_STYLE: Automatic

targets:
  TwoOfUs:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUs
        excludes:
          - TwoOfUs.icon
      # The Liquid Glass icon bundle must be a single file reference (compiled by
      # actool), not a recursed group of loose json/png resources.
      - path: TwoOfUs/TwoOfUs.icon
        type: file
        buildPhase: resources
    info:
      path: TwoOfUs/Info.plist
      properties:
        CFBundleDisplayName: Two of Us
        # Wire versions to build settings — XcodeGen otherwise writes literal
        # "1.0"/"1", which would make ci_post_clone.sh's CI_BUILD_NUMBER
        # stamping a no-op and every TestFlight upload a duplicate 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS/CloudKit crypto — exempt. Without this, every
        # TestFlight build waits on a manual export-compliance answer in ASC.
        ITSAppUsesNonExemptEncryption: NO
        # Required for CloudKit sharing: without it, iOS won't route a tapped
        # invite link into the app (the scene/app delegate accept handlers
        # never fire) and the co-parent can never join.
        CKSharingSupported: YES
        # Custom URL scheme the Feed/Diaper home widgets tap into
        # (twoofus://log/feed · twoofus://log/diaper) to open their log sheet.
        CFBundleURLTypes:
          - CFBundleURLName: com.taylorseale.twoofus.deeplink
            CFBundleURLSchemes:
              - twoofus
        # Schemes the sleep card's camera button probes before falling back to
        # the App Store. Undeclared schemes make canOpenURL return false with no
        # error, so omitting one here silently sends every tap to the App Store.
        # eufysecurity = unified eufy app; eufybaby/eufycare = legacy eufy Baby.
        LSApplicationQueriesSchemes:
          - eufysecurity
          - eufybaby
          - eufycare
        # Plain launch field matching the app background in both schemes (the
        # LaunchBackground colorset), so cold launch lands directly on the first
        # screen with no flash. No animated splash — removed once onboarding
        # stopped opening on the dark welcome stage.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: YES
        NSAlarmKitUsageDescription: Two of Us uses alarms to remind you when the next feed is due, even when your phone is silenced.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: TwoOfUs/TwoOfUs.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taylorseale.twoofus
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.taylorseale.twoofus
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: TwoOfUs
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TwoOfUsWidgets
      - target: TwoOfUsNotificationContent
      - target: TwoOfUsWatch

  TwoOfUsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUsWidgets
      - path: TwoOfUs/Models/Baby.swift
      - path: TwoOfUs/Models/FeedEvent.swift
      - path: TwoOfUs/Models/SleepEvent.swift
      - path: TwoOfUs/Models/DiaperEvent.swift
      - path: TwoOfUs/Models/NoteEvent.swift
      - path: TwoOfUs/Models/Participant.swift
      - path: TwoOfUs/Models/SharedSettings.swift
      - path: TwoOfUs/Models/PlanSlot.swift
      - path: TwoOfUs/Models/PlanOverride.swift
      - path: TwoOfUs/Models/Enums.swift
      - path: TwoOfUs/Store/Schema.swift
      # Pure, store-free — SharedSettings.feedInterval calls into it to decide
      # day vs. night spacing, so any target compiling SharedSettings.swift
      # needs it too.
      - path: TwoOfUs/Store/NightScheduleGenerator.swift
      - path: TwoOfUs/Store/WakeWindow.swift
      - path: TwoOfUs/Support/AppGroup.swift
      - path: TwoOfUs/DesignSystem/Colors.swift
      - path: TwoOfUs/DesignSystem/Typography.swift
      - path: TwoOfUs/DesignSystem/TimeFormatting.swift
      - path: TwoOfUs/DesignSystem/Urgency.swift
      - path: TwoOfUs/DesignSystem/DayRibbon.swift
      - path: TwoOfUs/LiveActivities/SleepActivityAttributes.swift
      # The sleep intents below are LiveActivityIntents (they run in the APP
      # process so they can start/stop the Live Activity); this file must
      # compile wherever the intents do. Brings AppLog with it.
      - path: TwoOfUs/LiveActivities/SleepActivityManager.swift
      - path: TwoOfUs/Support/AppLog.swift
      # Shared with the app target: interactive-widget / Siri App Intents + their writer.
      - path: TwoOfUs/Intents/QuickLogger.swift
      - path: TwoOfUs/Intents/LogFeedIntent.swift
      - path: TwoOfUs/Intents/LogDiaperIntent.swift
      - path: TwoOfUs/Intents/ToggleSleepIntent.swift
      - path: TwoOfUs/Intents/ConfirmationSnippet.swift
    info:
      path: TwoOfUsWidgets/Info.plist
      properties:
        CFBundleDisplayName: TwoOfUsWidgets
        # Keep extension versions in lockstep with the app (App Store requires it).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TwoOfUsWidgets/TwoOfUsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taylorseale.twoofus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO

  # Apple Watch companion app — single-target watchOS app, installed with the
  # iPhone app. Runs its own SwiftData store + a trimmed CKSyncEngine layer
  # (WatchSyncManager) against the SAME CloudKit zone as the phones, so it
  # works with the phone out of reach. Shares the model/sync mapping sources
  # with the phone targets so both speak an identical record dialect.
  TwoOfUsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUsWatch
      - path: TwoOfUs/Models/Baby.swift
      - path: TwoOfUs/Models/FeedEvent.swift
      - path: TwoOfUs/Models/SleepEvent.swift
      - path: TwoOfUs/Models/DiaperEvent.swift
      - path: TwoOfUs/Models/NoteEvent.swift
      - path: TwoOfUs/Models/Participant.swift
      - path: TwoOfUs/Models/SharedSettings.swift
      - path: TwoOfUs/Models/PlanSlot.swift
      - path: TwoOfUs/Models/PlanOverride.swift
      - path: TwoOfUs/Models/Enums.swift
      - path: TwoOfUs/Models/SoftDeletable.swift
      - path: TwoOfUs/Store/Schema.swift
      - path: TwoOfUs/Store/NightScheduleGenerator.swift
      - path: TwoOfUs/Store/WakeWindow.swift
      - path: TwoOfUs/Support/AppGroup.swift
      - path: TwoOfUs/Support/AppLog.swift
      - path: TwoOfUs/DesignSystem/TimeFormatting.swift
      # Pure-SwiftUI design-system files that compile against the watch's own
      # AppColor/AppFont tokens (WatchDesign.swift) — same semantic names,
      # no-UIKit implementations.
      - path: TwoOfUs/DesignSystem/Urgency.swift
      - path: TwoOfUs/DesignSystem/CradleMark.swift
      - path: TwoOfUs/Features/Shared/Avatar.swift
      - path: TwoOfUs/Sync/SyncConstants.swift
      - path: TwoOfUs/Sync/RecordMapping.swift
      # Keychain-free pieces of the SNOO credential model — RecordMapping's
      # SharedSettings conflict absorption parses the shared blob.
      - path: TwoOfUs/SNOO/SnooTokenStore.swift
      # The same write path the widgets/Siri use on the phone: self-contained,
      # attributes events via the App Group identity key, queues synced ids
      # per-key for the (watch) engine to drain.
      - path: TwoOfUs/Intents/QuickLogger.swift
    info:
      path: TwoOfUsWatch/Info.plist
      properties:
        CFBundleDisplayName: Two of Us
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: NO
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.taylorseale.twoofus
        # The watch talks to CloudKit itself — no phone in reach required.
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: TwoOfUsWatch/TwoOfUsWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taylorseale.twoofus
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.taylorseale.twoofus
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TwoOfUsWatchComplication

  # Watch complication (WidgetKit): the running sleep timer while the baby is
  # down, else time since the last feed. Reads the watch app's App Group store
  # — no CloudKit access of its own.
  TwoOfUsWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUsWatchComplication
      - path: TwoOfUs/Models/Baby.swift
      - path: TwoOfUs/Models/FeedEvent.swift
      - path: TwoOfUs/Models/SleepEvent.swift
      - path: TwoOfUs/Models/DiaperEvent.swift
      - path: TwoOfUs/Models/NoteEvent.swift
      - path: TwoOfUs/Models/Participant.swift
      - path: TwoOfUs/Models/SharedSettings.swift
      - path: TwoOfUs/Models/PlanSlot.swift
      - path: TwoOfUs/Models/PlanOverride.swift
      - path: TwoOfUs/Models/Enums.swift
      - path: TwoOfUs/Store/Schema.swift
      # Pure, store-free — SharedSettings.feedInterval calls into it, so any
      # target compiling SharedSettings.swift needs it too.
      - path: TwoOfUs/Store/NightScheduleGenerator.swift
      - path: TwoOfUs/Store/WakeWindow.swift
      # Tonight's dynamic schedule (Next Feed / Night Shift complications):
      # NightSchedule computes who's up next; ScheduleEngine carries
      # ScheduleOccurrence and the dayKey/materialize helpers it leans on.
      - path: TwoOfUs/Store/NightSchedule.swift
      - path: TwoOfUs/Store/ScheduleEngine.swift
      - path: TwoOfUs/Support/AppGroup.swift
      - path: TwoOfUs/DesignSystem/TimeFormatting.swift
      - path: TwoOfUs/DesignSystem/Urgency.swift
      # The brand mark, for the launcher complication.
      - path: TwoOfUs/DesignSystem/CradleMark.swift
      # Watch-native AppColor/AppFont tokens (shared with the watch app).
      - path: TwoOfUsWatch/WatchDesign.swift
    info:
      path: TwoOfUsWatchComplication/Info.plist
      properties:
        CFBundleDisplayName: TwoOfUsWatchComplication
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TwoOfUsWatchComplication/TwoOfUsWatchComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taylorseale.twoofus
    settings:
      base:
        # ".widgets" (matching the phone extension's naming), NOT
        # ".complication": that exact identifier came back "not available"
        # from Apple's registration service for this team — likely a reserved
        # suffix — and both local and Xcode Cloud archives fail signing on it.
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus.watchkitapp.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO

  TwoOfUsNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUsNotificationContent
      # Shared with the app target: the App Group read path + design system so the
      # rich card reflects live data and matches the app's look.
      - path: TwoOfUs/Intents/QuickLogger.swift
      - path: TwoOfUs/Models/Baby.swift
      - path: TwoOfUs/Models/FeedEvent.swift
      - path: TwoOfUs/Models/SleepEvent.swift
      - path: TwoOfUs/Models/DiaperEvent.swift
      - path: TwoOfUs/Models/NoteEvent.swift
      - path: TwoOfUs/Models/Participant.swift
      - path: TwoOfUs/Models/SharedSettings.swift
      - path: TwoOfUs/Models/PlanSlot.swift
      - path: TwoOfUs/Models/PlanOverride.swift
      - path: TwoOfUs/Models/Enums.swift
      - path: TwoOfUs/Store/Schema.swift
      # Pure, store-free — SharedSettings.feedInterval calls into it to decide
      # day vs. night spacing, so any target compiling SharedSettings.swift
      # needs it too.
      - path: TwoOfUs/Store/NightScheduleGenerator.swift
      - path: TwoOfUs/Store/WakeWindow.swift
      - path: TwoOfUs/Support/AppGroup.swift
      - path: TwoOfUs/DesignSystem/Colors.swift
      - path: TwoOfUs/DesignSystem/Typography.swift
      - path: TwoOfUs/DesignSystem/TimeFormatting.swift
      - path: TwoOfUs/Notifications/NotificationIdentifiers.swift
    info:
      path: TwoOfUsNotificationContent/Info.plist
      properties:
        CFBundleDisplayName: TwoOfUsNotificationContent
        # Wire versions to the project-level build settings like the app and
        # widget targets do. Without these, XcodeGen writes literal 1.0/1 into
        # the plist and every MARKETING_VERSION bump trips ITMS-90473
        # (CFBundleShortVersionString mismatch) on upload — as build 76 did.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - MILESTONE
              - COPARENT
              - REMINDER_FEED
              - REMINDER_DIAPER
            UNNotificationExtensionInitialContentSizeRatio: 0.4
            UNNotificationExtensionDefaultContentHidden: true
    entitlements:
      path: TwoOfUsNotificationContent/TwoOfUsNotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taylorseale.twoofus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus.notificationcontent
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO

  # Unit tests, hosted in the app so they can exercise the real targets'
  # internals (@testable). Pure store/sync-logic tests — no CloudKit server,
  # no iCloud account needed; `make test` runs them on the simulator.
  TwoOfUsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUsTests
    dependencies:
      - target: TwoOfUs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  # UI smoke tests: drive the app through its core interactive flows (log,
  # delete + undo, destructive-action confirmations, tab navigation) and capture
  # a screenshot per screen. Kept in their OWN scheme so `make test` / Xcode
  # Cloud's unit path stays fast — run these with `make uitest`.
  TwoOfUsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TwoOfUsUITests
    dependencies:
      - target: TwoOfUs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylorseale.twoofus.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: TwoOfUs

schemes:
  TwoOfUs:
    build:
      targets:
        TwoOfUs: all
        TwoOfUsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TwoOfUsTests
    archive:
      config: Release

  # Watch app scheme — build/run the watch app directly on a watch simulator.
  TwoOfUsWatch:
    build:
      targets:
        TwoOfUsWatch: all
    run:
      config: Debug
    archive:
      config: Release

  # Separate scheme so the slow, UI-driven smoke tests never run in the fast
  # unit path (`make test`) or the Xcode Cloud unit workflow. `make uitest`.
  TwoOfUsUITests:
    build:
      targets:
        TwoOfUs: all
        TwoOfUsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TwoOfUsUITests
